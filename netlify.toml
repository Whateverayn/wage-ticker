[build]
  command = "pnpm run build"
  publish = "dist"

# All in-app "routing" is hash-based (#/import, #/setup); the server never
# actually receives a request for anything but "/". This is a defensive
# fallback for stray/legacy requests, not load-bearing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker and manifest must always be revalidated so update checks
# aren't delayed by caching.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Vite's content-hashed build assets are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
