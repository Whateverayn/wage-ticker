<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勤務カウンター</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0a0a0b;
    --card:#18181b;
    --border:#2b2b2f;
    --text:#f4f4f5;
    --muted:#9a9aa2;
    --accent:#4ade80;
  }
  *{box-sizing:border-box;min-width:0;}
  html,body{width:100%;overflow-x:hidden;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    max-width:360px;
    margin-bottom:18px;
  }
  h1{font-size:0.9rem;font-weight:600;margin:0;color:var(--muted);}
  .setup, .dashboard, .panel{width:100%;max-width:360px;}
  .setup{display:flex;flex-direction:column;gap:16px;}
  label{font-size:0.78rem;color:var(--muted);display:block;margin-bottom:4px;}
  input, select, textarea{
    width:100%;
    max-width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:0.92rem;
    font-family:inherit;
  }
  textarea{font-family:monospace;font-size:0.72rem;min-height:120px;resize:vertical;}
  input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(1);}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  button{
    padding:12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--accent);
    color:#052e16;
    font-weight:700;
    font-size:0.92rem;
    cursor:pointer;
  }
  button:active{opacity:0.8;}
  .ghost{background:transparent;color:var(--muted);font-size:0.75rem;padding:6px 10px;font-weight:500;border-color:var(--border);}
  details{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--card);}
  summary{cursor:pointer;font-size:0.82rem;color:var(--muted);}
  .detail-body{display:flex;flex-direction:column;gap:14px;margin-top:12px;}
  .subhead{font-size:0.75rem;color:var(--muted);}
  .band-row, .cost-row{display:flex;gap:6px;align-items:center;}
  .band-row select, .band-row input{flex:1;font-size:0.82rem;padding:8px;}
  .cost-row input[type="text"]{flex:2;font-size:0.82rem;padding:8px;}
  .cost-row input[type="number"]{flex:1;font-size:0.82rem;padding:8px;}
  .row-del{flex:0 0 auto;padding:8px 10px;font-size:0.75rem;background:transparent;color:var(--muted);}
  .add-row{background:transparent;color:var(--accent);border-color:var(--border);font-size:0.8rem;padding:8px;}
  .dashboard{display:none;flex-direction:column;gap:14px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;}
  .earned{font-size:2.1rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);}
  .breakdown{margin-top:6px;font-size:0.7rem;color:var(--muted);font-variant-numeric:tabular-nums;}
  .sub{margin-top:4px;color:var(--muted);font-size:0.76rem;}
  .row{display:flex;gap:12px;}
  .row .card{flex:1;padding:14px;}
  .row .big{font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .barwrap{width:100%;height:8px;background:#2b2b2f;border-radius:999px;overflow:hidden;margin-top:10px;}
  .bar{height:100%;width:0%;background:var(--accent);transition:width 0.3s linear;}
  .pct{font-size:0.82rem;color:var(--muted);font-variant-numeric:tabular-nums;}
  .status{font-size:0.76rem;color:var(--muted);text-align:center;margin-top:2px;}
  .overtime{color:var(--accent);font-weight:600;}
  .actions{display:flex;gap:10px;}
  .actions button{flex:1;}
  .secondary, .share{background:transparent;color:var(--text);}
  .preview{display:none;flex-direction:column;align-items:center;gap:8px;}
  .preview img{width:180px;height:180px;object-fit:cover;border-radius:12px;border:1px solid var(--border);}
  .preview .hint{font-size:0.75rem;color:var(--muted);}
  .preview button{width:auto;padding:8px 16px;background:transparent;color:var(--muted);font-weight:500;font-size:0.78rem;}
  .panel{display:none;flex-direction:column;gap:10px;margin-bottom:16px;}
  .panel .actions button{font-size:0.8rem;padding:9px;}
  .note{font-size:0.7rem;color:var(--muted);}
</style>
</head>
<body>

<div class="topbar">
  <h1>勤務カウンター</h1>
  <button class="ghost" id="textPanelToggle">テキスト管理</button>
</div>

<div class="panel" id="textPanel">
  <textarea id="textArea" placeholder="ここに書き出したテキストを貼り付けて「読み込む」を押すと復元できます"></textarea>
  <div class="actions">
    <button class="ghost" id="copyBtn">コピー</button>
    <button class="ghost" id="shareTextBtn">共有</button>
    <button id="loadTextBtn">読み込む</button>
  </div>
  <div class="note">保存に失敗する環境向けに、設定をテキストとして書き出し・読み込みできます。</div>
</div>

<div class="setup" id="setup">
  <div>
    <label>勤務開始時刻</label>
    <input type="time" id="startTime">
  </div>
  <div>
    <label>勤務終了予定時刻</label>
    <input type="time" id="endTime">
  </div>
  <div>
    <label>基本時給（円）</label>
    <input type="number" id="wage" placeholder="例: 1200" min="0">
  </div>

  <details>
    <summary>詳細設定（時間帯割増・固定費）</summary>
    <div class="detail-body">
      <div>
        <div class="subhead">割増時間帯（夜間・搬入出など、複数追加可）</div>
        <div id="bandsList"></div>
        <button type="button" class="add-row" id="addBand">＋ 時間帯を追加</button>
      </div>
      <div>
        <div class="subhead">固定費（交通費など）</div>
        <div id="costsList"></div>
        <button type="button" class="add-row" id="addCost">＋ 固定費を追加</button>
      </div>
    </div>
  </details>

  <button id="startBtn">スタート</button>
</div>

<div class="dashboard" id="dashboard">
  <div class="card">
    <div class="earned" id="earned">¥0</div>
    <div class="breakdown" id="breakdown" style="display:none;"></div>
    <div class="sub">現在までに稼いだ金額</div>
    <div class="barwrap"><div class="bar" id="bar"></div></div>
    <div class="pct" id="pctLabel">0%</div>
    <div class="status" id="statusMsg"></div>
  </div>

  <div class="row">
    <div class="card">
      <div class="big" id="elapsed">0:00:00</div>
      <div class="sub">経過時間</div>
    </div>
    <div class="card">
      <div class="big" id="remaining">0:00:00</div>
      <div class="sub" id="remainingLabel">残り時間</div>
    </div>
  </div>

  <div class="actions">
    <button class="share" id="shareBtn">画像で共有</button>
    <button class="secondary" id="resetBtn">やり直す</button>
  </div>

  <div class="preview" id="preview">
    <img id="previewImg" alt="共有用画像">
    <div class="hint">長押しで画像を保存できます</div>
    <button id="closePreview">閉じる</button>
  </div>
</div>

<canvas id="shareCanvas" width="900" height="900" style="display:none;"></canvas>

<script>
let startDate, endDate, wage, bands = [], fixedCosts = [], timer;
const STORAGE_KEY = 'work-session';

/* ---------- 時間帯・固定費の行UI ---------- */

function addBandRow(band){
  band = band || {start:'22:00', end:'05:00', type:'percent', value:25};
  const row = document.createElement('div');
  row.className = 'band-row';
  row.innerHTML = `
    <input type="time" class="bandStart" value="${band.start}">
    <input type="time" class="bandEnd" value="${band.end}">
    <select class="bandType">
      <option value="percent" ${band.type==='percent'?'selected':''}>%増し</option>
      <option value="fixed" ${band.type==='fixed'?'selected':''}>円/時 加算</option>
    </select>
    <input type="number" class="bandValue" value="${band.value}">
    <button type="button" class="row-del">×</button>
  `;
  row.querySelector('.row-del').addEventListener('click', () => row.remove());
  document.getElementById('bandsList').appendChild(row);
}

function addCostRow(cost){
  cost = cost || {label:'交通費', amount:0};
  const row = document.createElement('div');
  row.className = 'cost-row';
  row.innerHTML = `
    <input type="text" class="costLabel" placeholder="項目名" value="${cost.label}">
    <input type="number" class="costAmount" placeholder="金額" value="${cost.amount}">
    <button type="button" class="row-del">×</button>
  `;
  row.querySelector('.row-del').addEventListener('click', () => row.remove());
  document.getElementById('costsList').appendChild(row);
}

document.getElementById('addBand').addEventListener('click', () => addBandRow());
document.getElementById('addCost').addEventListener('click', () => addCostRow());

function readBandsFromDOM(){
  return Array.from(document.querySelectorAll('.band-row')).map(row => ({
    start: row.querySelector('.bandStart').value,
    end: row.querySelector('.bandEnd').value,
    type: row.querySelector('.bandType').value,
    value: parseFloat(row.querySelector('.bandValue').value) || 0
  })).filter(b => b.start && b.end);
}

function readCostsFromDOM(){
  return Array.from(document.querySelectorAll('.cost-row')).map(row => ({
    label: row.querySelector('.costLabel').value || '固定費',
    amount: parseFloat(row.querySelector('.costAmount').value) || 0
  })).filter(c => c.amount !== 0 || c.label);
}

/* ---------- 保存・復元 ---------- */

function currentState(){
  return {
    start: startDate.toISOString(),
    end: endDate.toISOString(),
    wage: wage,
    bands: bands,
    fixedCosts: fixedCosts
  };
}

function saveSession(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentState()));
  }catch(e){
    console.error('保存に失敗しました', e);
  }
}

function loadSessionFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return applyState(JSON.parse(raw));
  }catch(e){}
  return false;
}

function applyState(data){
  if(!data || !data.start || !data.end) return false;
  startDate = new Date(data.start);
  endDate = new Date(data.end);
  wage = data.wage || 0;
  bands = data.bands || [];
  fixedCosts = data.fixedCosts || [];
  return true;
}

function clearSession(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

/* ---------- 画面切り替え ---------- */

function showDashboard(){
  document.getElementById('setup').style.display = 'none';
  document.getElementById('dashboard').style.display = 'flex';
  update();
  clearInterval(timer);
  timer = setInterval(update, 50);
}

function showSetup(){
  clearInterval(timer);
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
}

document.getElementById('startBtn').addEventListener('click', () => {
  const st = document.getElementById('startTime').value;
  const et = document.getElementById('endTime').value;
  const wg = parseFloat(document.getElementById('wage').value);

  if(!st || !et || isNaN(wg) || wg <= 0){
    alert('開始時刻・終了時刻・基本時給をすべて入力してください');
    return;
  }

  const now = new Date();
  startDate = parseTimeOnDate(st, now);
  endDate = parseTimeOnDate(et, now);
  if(endDate <= startDate) endDate.setDate(endDate.getDate() + 1);
  wage = wg;
  bands = readBandsFromDOM();
  fixedCosts = readCostsFromDOM();

  saveSession();
  showDashboard();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  clearSession();
  showSetup();
});

document.getElementById('closePreview').addEventListener('click', () => {
  document.getElementById('preview').style.display = 'none';
});

/* ---------- テキスト管理パネル ---------- */

const textPanel = document.getElementById('textPanel');
document.getElementById('textPanelToggle').addEventListener('click', () => {
  const opening = textPanel.style.display !== 'flex';
  textPanel.style.display = opening ? 'flex' : 'none';
  if(opening && startDate){
    document.getElementById('textArea').value = JSON.stringify(currentState(), null, 2);
  }
});

document.getElementById('copyBtn').addEventListener('click', async () => {
  const ta = document.getElementById('textArea');
  let ok = false;
  try{
    await navigator.clipboard.writeText(ta.value);
    ok = true;
  }catch(e){
    try{ ta.select(); document.execCommand('copy'); ok = true; }catch(e2){}
  }
  const btn = document.getElementById('copyBtn');
  const original = btn.textContent;
  btn.textContent = ok ? 'コピーしました' : '失敗しました';
  setTimeout(() => btn.textContent = original, 1500);
});

document.getElementById('shareTextBtn').addEventListener('click', async () => {
  const text = document.getElementById('textArea').value;
  if(navigator.share){
    try{ await navigator.share({text, title:'勤務カウンター設定'}); return; }catch(e){}
  }
  alert('共有機能が使えない環境です。テキストエリアから直接コピーしてください。');
});

document.getElementById('loadTextBtn').addEventListener('click', () => {
  let data;
  try{
    data = JSON.parse(document.getElementById('textArea').value);
  }catch(e){
    alert('テキストの形式が正しくありません');
    return;
  }
  if(!applyState(data)){
    alert('必要なデータが含まれていません');
    return;
  }
  saveSession();
  textPanel.style.display = 'none';
  showDashboard();
});

document.getElementById('shareBtn').addEventListener('click', () => shareImage());

/* ---------- 時間計算 ---------- */

function parseTimeOnDate(hhmm, baseDate){
  const [h,m] = hhmm.split(':').map(Number);
  const d = new Date(baseDate);
  d.setHours(h,m,0,0);
  return d;
}

function formatHMS(ms){
  if(ms < 0) ms = 0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// 特定の割増時間帯(毎日繰り返し)と[rangeStart, rangeEnd]の重なりミリ秒を求める
function bandOverlapMs(band, rangeStart, rangeEnd){
  if(rangeEnd <= rangeStart) return 0;
  let total = 0;
  let dayCursor = new Date(rangeStart);
  dayCursor.setHours(0,0,0,0);
  dayCursor.setDate(dayCursor.getDate() - 1);
  const limit = new Date(rangeEnd);
  limit.setHours(0,0,0,0);
  limit.setDate(limit.getDate() + 1);

  while(dayCursor <= limit){
    const bStart = parseTimeOnDate(band.start, dayCursor);
    let bEnd = parseTimeOnDate(band.end, dayCursor);
    if(bEnd <= bStart) bEnd.setDate(bEnd.getDate() + 1);
    const overlapStart = Math.max(bStart.getTime(), rangeStart.getTime());
    const overlapEnd = Math.min(bEnd.getTime(), rangeEnd.getTime());
    if(overlapEnd > overlapStart) total += (overlapEnd - overlapStart);
    dayCursor.setDate(dayCursor.getDate() + 1);
  }
  return total;
}

function computeTimeEarnings(rangeStart, rangeEnd, baseWage, bandList){
  const hours = Math.max(0, rangeEnd - rangeStart) / (3600*1000);
  let total = baseWage * hours;
  let bonus = 0;
  for(const band of bandList){
    const overlapHours = bandOverlapMs(band, rangeStart, rangeEnd) / (3600*1000);
    if(overlapHours <= 0) continue;
    if(band.type === 'percent'){
      bonus += baseWage * (band.value/100) * overlapHours;
    } else {
      bonus += band.value * overlapHours;
    }
  }
  return {base: baseWage*hours, bonus, total: total+bonus};
}

let lastState = {earned:0, pct:0, elapsedMs:0, remainingMs:0, overtime:false};

function update(){
  const now = new Date();
  const totalMs = endDate - startDate;
  const elapsedMs = Math.max(0, now - startDate);
  const isOvertime = now > endDate;

  const statusMsg = document.getElementById('statusMsg');
  const remainingLabel = document.getElementById('remainingLabel');
  const remainingEl = document.getElementById('remaining');

  if(now < startDate){
    statusMsg.textContent = 'まだ勤務開始前です';
    statusMsg.className = 'status';
  } else if(isOvertime){
    statusMsg.textContent = '定時を超えています（残業中）';
    statusMsg.className = 'status overtime';
  } else {
    statusMsg.textContent = '勤務中...';
    statusMsg.className = 'status';
  }

  if(isOvertime){
    remainingLabel.textContent = '残業時間';
    remainingLabel.className = 'sub overtime';
    remainingEl.textContent = formatHMS(now - endDate);
  } else {
    remainingLabel.textContent = '残り時間';
    remainingLabel.className = 'sub';
    remainingEl.textContent = formatHMS(endDate - now);
  }

  const {base, bonus, total: timeEarnings} = computeTimeEarnings(startDate, now, wage, bands);
  const fixedTotal = fixedCosts.reduce((s,c) => s + c.amount, 0);
  const earned = timeEarnings + fixedTotal;
  const pct = totalMs > 0 ? (elapsedMs/totalMs)*100 : 0;

  document.getElementById('earned').textContent = '¥' + earned.toLocaleString('ja-JP', {minimumFractionDigits:2, maximumFractionDigits:2});

  const breakdown = document.getElementById('breakdown');
  if(fixedCosts.length > 0 || bands.length > 0){
    const parts = [];
    parts.push('時給分 ¥' + base.toLocaleString('ja-JP',{maximumFractionDigits:0}));
    if(bands.length > 0) parts.push('割増 ¥' + bonus.toLocaleString('ja-JP',{maximumFractionDigits:0}));
    if(fixedCosts.length > 0) parts.push('固定費 ¥' + fixedTotal.toLocaleString('ja-JP',{maximumFractionDigits:0}));
    breakdown.textContent = parts.join(' ｜ ');
    breakdown.style.display = 'block';
  } else {
    breakdown.style.display = 'none';
  }

  document.getElementById('elapsed').textContent = formatHMS(elapsedMs);
  document.getElementById('bar').style.width = Math.min(100, pct) + '%';
  document.getElementById('pctLabel').textContent = pct.toFixed(3) + '%';

  lastState = {earned, pct, elapsedMs, remainingMs: Math.max(0, endDate-now), overtimeMs: Math.max(0, now-endDate), overtime: isOvertime};
}

/* ---------- 画像共有 ---------- */

function drawShareCanvas(){
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#ff6ec7');
  grad.addColorStop(0.5,'#7873f5');
  grad.addColorStop(1,'#4fd1ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(120,120,180,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W-100,H-150,220,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.font = '90px sans-serif';
  ctx.fillText('💰', W/2, 220);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 100px sans-serif';
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = 12;
  const earnedText = '¥' + Math.floor(lastState.earned).toLocaleString('ja-JP');
  ctx.fillText(earnedText, W/2, 380);
  ctx.shadowBlur = 0;

  ctx.font = '32px sans-serif';
  ctx.fillText('今のところ稼いだ金額', W/2, 430);

  const barX = 100, barY = 500, barW = W-200, barH = 40;
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  roundRect(ctx, barX, barY, barW, barH, 20); ctx.fill();
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, barX, barY, barW * (Math.min(100,lastState.pct)/100), barH, 20); ctx.fill();

  ctx.font = 'bold 40px sans-serif';
  ctx.fillText(lastState.pct.toFixed(1) + '% 経過', W/2, 590);

  ctx.font = '30px sans-serif';
  ctx.fillText('経過時間 ' + formatHMS(lastState.elapsedMs), W/2, 680);
  if(lastState.overtime){
    ctx.fillText('残業時間 ' + formatHMS(lastState.overtimeMs), W/2, 725);
  } else {
    ctx.fillText('残り時間 ' + formatHMS(lastState.remainingMs), W/2, 725);
  }

  if(lastState.overtime){
    ctx.font = 'bold 44px sans-serif';
    ctx.fillText('⏰ 残業中 ⏰', W/2, 820);
  }

  return canvas;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

async function shareImage(){
  const canvas = drawShareCanvas();
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  if(!blob) return;
  const file = new File([blob], 'work-earnings.png', {type:'image/png'});

  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'勤務状況', text:'今の稼ぎ状況'});
      return;
    }catch(e){
      if(e.name === 'AbortError') return;
    }
  }

  const dataUrl = canvas.toDataURL('image/png');
  document.getElementById('previewImg').src = dataUrl;
  document.getElementById('preview').style.display = 'flex';
}

/* ---------- 初期化 ---------- */

if(loadSessionFromStorage()){
  showDashboard();
}
</script>

</body>
</html>
